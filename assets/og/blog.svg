<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cybersecurity career roadmaps">
  <!-- Source for blog.png. Fonts: Outfit, Inter, JetBrains Mono (self-hosted in web/assets/fonts). Re-render at 1200x630 after editing. -->
  <defs>
    <style>@font-face{font-family:'Outfit';font-weight:100 900;src:url('outfit-var.woff2') format('woff2');}@font-face{font-family:'Inter';font-weight:100 900;src:url('inter-var.woff2') format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url('jetbrains-mono-var.woff2') format('woff2');}</style>
    <linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="fade"><rect x="0" y="0" width="1200" height="630" fill="url(#fg)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#050505"/>
  <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.6" fill="#ef4444"/></pattern>
  <rect x="660" y="0" width="540" height="630" fill="url(#p)" opacity="0.28" mask="url(#fade)"/>
  <rect x="0" y="0" width="16" height="630" fill="#ef4444"/>
  <g class="illo" transform="translate(950,318) scale(0.92)">
    <circle r="215" fill="#ef4444" opacity="0.07"/><circle r="215" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-98" y="-68" width="270" height="180" rx="16" fill="#050505" fill="none" stroke="#9a9a9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-124" y="-94" width="270" height="180" rx="16" fill="#050505" fill="none" stroke="#9a9a9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-150" y="-120" width="270" height="180" rx="16" fill="#050505" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-118" y1="-72" x2="20" y2="-72" fill="none" stroke="#ef4444" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="-118" y1="-30" x2="80" y2="-30" fill="none" stroke="#f5f5f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="-118" y1="4" x2="60" y2="4" fill="none" stroke="#f5f5f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="-118" y1="38" x2="90" y2="38" fill="none" stroke="#f5f5f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(150,110) rotate(-45)"><rect x="-14" y="-90" width="28" height="130" rx="6" fill="#ef4444"/><path d="M-14,40 L0,70 L14,40 Z" fill="#f5f5f5"/></g>
  </g>
  <text class="p" x="84" y="94" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#ef4444">sarathg.me/blog</text>
  <text class="h" x="84" y="264" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#f5f5f5">Cybersecurity</text>
  <text class="h" x="84" y="322" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#f5f5f5">career roadmaps</text>
  <text class="s" x="84" y="370" font-family="Inter" font-weight="400" font-size="26" fill="#9a9a9a">Practical, mostly free plans for</text>
  <text class="s" x="84" y="406" font-family="Inter" font-weight="400" font-size="26" fill="#9a9a9a">getting in and getting unstuck.</text>
  <text class="f" x="84" y="560" font-family="Inter" font-weight="600" font-size="24" fill="#f5f5f5">Sarath G</text>
  <text class="f" x="212" y="560" font-family="Inter" font-weight="400" font-size="24" fill="#9a9a9a">Cybersecurity consultant &amp; trainer</text>
</svg>
