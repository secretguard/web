<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bug bounty for beginners">
  <!-- Source for bugbounty.png. Fonts: Outfit, Inter, JetBrains Mono (self-hosted in web/assets/fonts). Re-render at 1200x630 after editing. -->
  <defs>
    <style>@font-face{font-family:'Outfit';font-weight:100 900;src:url('outfit-var.woff2') format('woff2');}@font-face{font-family:'Inter';font-weight:100 900;src:url('inter-var.woff2') format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url('jetbrains-mono-var.woff2') format('woff2');}</style>
    <linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="fade"><rect x="0" y="0" width="1200" height="630" fill="url(#fg)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#0d0f0e"/>
  <pattern id="p" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="18" fill="#ffb454"/></pattern>
  <polygon points="1000,0 1200,0 1200,630 880,630" fill="url(#p)" opacity="0.10"/>
  <rect x="0" y="0" width="16" height="630" fill="#ffb454"/>
  <g class="illo" transform="translate(950,318) scale(0.92)">
    <circle r="215" fill="#ffb454" opacity="0.07"/><circle r="215" fill="none" stroke="#262b27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle r="185" fill="none" stroke="#ffb454" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 16"/>
    <line x1="0" y1="-210" x2="0" y2="-160" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="160" x2="0" y2="210" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="-210" y1="0" x2="-160" y2="0" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="160" y1="0" x2="210" y2="0" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cy="20" rx="62" ry="88" fill="#0d0f0e" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cy="-80" r="34" fill="#0d0f0e" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-68" x2="0" y2="108" fill="none" stroke="#ffb454" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22,-108 L-45,-145 M22,-108 L45,-145" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-60,-20 L-110,-50 M-62,20 L-115,20 M-55,60 L-105,95 M60,-20 L110,-50 M62,20 L115,20 M55,60 L105,95" fill="none" stroke="#ffb454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="p" x="84" y="94" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#ffb454">sarathg.me/bugbounty</text>
  <text class="h" x="84" y="264" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#e8e6df">Bug bounty</text>
  <text class="h" x="84" y="322" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#e8e6df">for beginners</text>
  <text class="s" x="84" y="370" font-family="Inter" font-weight="400" font-size="26" fill="#8a9690">What to learn first, where to start,</text>
  <text class="s" x="84" y="406" font-family="Inter" font-weight="400" font-size="26" fill="#8a9690">and how to report your first real bug.</text>
  <text class="f" x="84" y="560" font-family="Inter" font-weight="600" font-size="24" fill="#e8e6df">Sarath G</text>
  <text class="f" x="212" y="560" font-family="Inter" font-weight="400" font-size="24" fill="#8a9690">Cybersecurity consultant &amp; trainer</text>
