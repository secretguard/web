<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="1:1 cybersecurity mentorship">
  <!-- Source for coaching.png. Fonts: Outfit, Inter, JetBrains Mono (self-hosted in web/assets/fonts). Re-render at 1200x630 after editing. -->
  <defs>
    <style>@font-face{font-family:'Outfit';font-weight:100 900;src:url('outfit-var.woff2') format('woff2');}@font-face{font-family:'Inter';font-weight:100 900;src:url('inter-var.woff2') format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url('jetbrains-mono-var.woff2') format('woff2');}</style>
    <linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="fade"><rect x="0" y="0" width="1200" height="630" fill="url(#fg)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#050505"/>
  <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.6" fill="#4fffb0"/></pattern>
  <rect x="660" y="0" width="540" height="630" fill="url(#p)" opacity="0.28" mask="url(#fade)"/>
  <rect x="0" y="0" width="16" height="630" fill="#4fffb0"/>
  <g class="illo" transform="translate(950,318) scale(0.92)">
    <circle r="215" fill="#4fffb0" opacity="0.07"/><circle r="215" fill="none" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-190" y="140" width="95" height="70" fill="#050505" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-95" y="70" width="95" height="140" fill="#050505" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="0" width="95" height="210" fill="#050505" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="95" y="-70" width="95" height="280" fill="#050505" fill="none" stroke="#4fffb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(-142,110) scale(1)"><circle cy="-26" r="18" fill="none" stroke="#f5f5f5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M-34,34 C-34,4 -18,-4 0,-4 C18,-4 34,4 34,34" fill="none" stroke="#f5f5f5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(142,-100) scale(1)"><circle cy="-26" r="18" fill="none" stroke="#4fffb0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M-34,34 C-34,4 -18,-4 0,-4 C18,-4 34,4 34,34" fill="none" stroke="#4fffb0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
    <path d="M-100,60 C-40,40 0,-20 90,-60" fill="none" stroke="#4fffb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 14"/>
  </g>
  <text class="p" x="84" y="94" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#4fffb0">sarathg.me/coaching</text>
  <text class="h" x="84" y="246" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#f5f5f5">1:1 cybersecurity</text>
  <text class="h" x="84" y="304" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#f5f5f5">mentorship</text>
  <text class="s" x="84" y="352" font-family="Inter" font-weight="400" font-size="26" fill="#9a9a9a">Pentest, VAPT and red team,</text>
  <text class="s" x="84" y="388" font-family="Inter" font-weight="400" font-size="26" fill="#9a9a9a">from beginner to job ready.</text>
  <text class="s" x="84" y="424" font-family="Inter" font-weight="400" font-size="26" fill="#9a9a9a">Built from your intake, not a syllabus.</text>
  <text class="f" x="84" y="560" font-family="Inter" font-weight="600" font-size="24" fill="#f5f5f5">Sarath G</text>
  <text class="f" x="212" y="560" font-family="Inter" font-weight="400" font-size="24" fill="#9a9a9a">Cybersecurity consultant &amp; trainer</text>
</svg>
