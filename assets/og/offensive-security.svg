    <line x1="0" y1="-200" x2="0" y2="-120" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="120" x2="0" y2="200" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="-200" y1="0" x2="-120" y2="0" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="120" y1="0" x2="200" y2="0" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="12" fill="#ef4444"/><g transform="translate(50,80)"><rect width="200" height="128" rx="14" fill="#050505" fill="none" stroke="#9a9a9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="40" x2="200" y2="40" stroke="#9a9a9a" stroke-width="3"/><circle cx="22" cy="20" r="6" fill="#9a9a9a"/><circle cx="42" cy="20" r="6" fill="#9a9a9a"/><circle cx="62" cy="20" r="6" fill="#9a9a9a"/><text x="22" y="78" text-anchor="start" font-family="JetBrains Mono" font-weight="600" font-size="22" fill="#f5f5f5">$ nmap -sV</text><text x="22" y="112" text-anchor="start" font-family="JetBrains Mono" font-weight="600" font-size="22" fill="#ef4444">$ ▌</text></g>
  </g>
  <text class="p" x="84" y="94" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#ef4444">sarathg.me/services/offensive-security</text>
  <text class="h" x="84" y="264" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#f5f5f5">Penetration testing</text>
  <text class="h" x="84" y="322" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#f5f5f5">&amp; offensive security</text>
  <text class="s" x="84" y="370" font-family="Inter" font-weight="400" font-size="26" fill="#9a9a9a">Web, network, API, mobile, red</text>
  <text class="s" x="84" y="406" font-family="Inter" font-weight="400" font-size="26" fill="#9a9a9a">team and adversary simulation.</text>
  <text class="f" x="84" y="560" font-family="Inter" font-weight="600" font-size="24" fill="#f5f5f5">Sarath G</text>
  <text class="f" x="212" y="560" font-family="Inter" font-weight="400" font-size="24" fill="#9a9a9a">Cybersecurity consultant &amp; trainer</text>
