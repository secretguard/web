  <text class="h" x="84" y="322" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#e8e6df">2026 edition</text>
  <text class="s" x="84" y="370" font-family="Inter" font-weight="400" font-size="26" fill="#8a9690">Learn to find anything online. Modern</text>
