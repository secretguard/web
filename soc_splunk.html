/* ============================================================
   Splunk for SOC Analysts — reading-optimized stylesheet
   ============================================================ */

:root {
  --bg: #fbfaf7;
  --bg-raised: #ffffff;
  --text: #2a2722;
  --heading: #18160f;
  --muted: #6b6358;
  --rule: #e7e2d8;
  --accent: #1e6e5c;
  --accent-soft: #e3efe9;
  --exercise-bg: #fffaf0;
  --exercise-border: #d4a657;
  --exercise-tag-bg: #d4a657;
  --warning-bg: #fdf1ef;
  --warning-border: #c1453a;
  --tip-bg: #eef5f1;
  --tip-border: #1e6e5c;
  --code-bg: #1c1f26;
  --code-text: #e8e6e1;
  --code-border: #30343d;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 96px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Source Serif 4", "Georgia", serif;
  -webkit-font-smoothing: antialiased;
}

::selection { background: #c9e3da; }

/* ---------- Side rail (persistent module navigation) ---------- */

:root {
  --rail-width: 268px;
  --portfolio-nav-height: 56px; /* reserved space for navbar.js, adjust if your navbar differs */
}

.app-shell {
  display: flex;
  align-items: flex-start;
  max-width: 1180px;
  margin: 0 auto;
}

.siderail {
  position: sticky;
  top: var(--portfolio-nav-height);
  width: var(--rail-width);
  flex-shrink: 0;
  height: calc(100vh - var(--portfolio-nav-height));
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--rule);
  background: rgba(251, 250, 247, 0.92);
  backdrop-filter: blur(10px) saturate(1.2);
  z-index: 90;
}

.progress-track {
  height: 3px;
  background: var(--rule);
  flex-shrink: 0;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.1s linear;
}

.siderail-head {
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}

.brand {
  font-family: "Inter", "Helvetica Neue", sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.03em;
  color: var(--heading);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 7px;
}

.siderail-progress-count {
  font-family: "Inter", sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 8px;
}

.jumplinks {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--rule) transparent;
}
.jumplinks::-webkit-scrollbar { width: 6px; }
.jumplinks::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

.jumplink-group {
  margin-bottom: 4px;
}

.jumplink-group-label {
  font-family: "Inter", sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 14px 10px 6px;
}

.jumplink {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: "Inter", "Helvetica Neue", sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
  text-decoration: none;
  white-space: normal;
  line-height: 1.4;
  padding: 8px 10px;
  border-radius: 7px;
  transition: background 0.15s, color 0.15s;
}

.jumplink:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.jumplink.active {
  background: var(--accent);
  color: #fff;
  font-weight: 600;
}

.jumplink-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--jl-accent, var(--muted));
  opacity: 0.7;
}

.jumplink.active .jumplink-dot {
  background: #fff;
  opacity: 0.9;
}

/* ---------- Page layout ---------- */

.page {
  max-width: 720px;
  margin: 0;
  padding: 0 24px 80px 40px;
  flex: 1;
  min-width: 0;
}

.hero {
  padding: 56px 0 40px;
  border-bottom: 1px solid var(--rule);
}

.hero-eyebrow {
  font-family: "Inter", sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 16px;
}

.hero h1 {
  font-family: "Source Serif 4", serif;
  font-size: clamp(32px, 5vw, 44px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.01em;
  color: var(--heading);
  margin: 0 0 18px;
}

.hero-sub {
  font-size: 18px;
  line-height: 1.7;
  color: var(--muted);
  max-width: 600px;
  margin: 0 0 20px;
}

.hero-meta {
  font-family: "Inter", sans-serif;
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ---------- Module ---------- */

.module {
  padding: 56px 0 8px;
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 96px;
}

.module:last-of-type { border-bottom: none; }

.module-header { margin-bottom: 28px; }

.module-day {
  font-family: "Inter", sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  display: inline-block;
  margin-bottom: 10px;
}

.module h2 {
  font-family: "Source Serif 4", serif;
  font-size: 30px;
  font-weight: 700;
  color: var(--heading);
  margin: 0 0 10px;
  line-height: 1.25;
}

.module-blurb {
  font-size: 16.5px;
  line-height: 1.6;
  color: var(--muted);
  margin: 0;
  font-style: italic;
}

/* ---------- Content sections ---------- */

.content-section {
  margin-bottom: 38px;
}

.content-section h3 {
  font-family: "Source Serif 4", serif;
  font-size: 21px;
  font-weight: 700;
  color: var(--heading);
  margin: 0 0 14px;
  line-height: 1.35;
}

.content-section p {
  font-size: 17px;
  line-height: 1.75;
  color: var(--text);
  margin: 0 0 16px;
}

.plain-steps, .key-points {
  margin: 0 0 16px;
  padding-left: 24px;
}

.plain-steps li, .key-points li {
  font-size: 16.5px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 9px;
}

.key-points { list-style: square; }

/* ---------- Tables ---------- */

.table-wrap {
  overflow-x: auto;
  margin: 4px 0 22px;
  border: 1px solid var(--rule);
  border-radius: 6px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-family: "Inter", sans-serif;
  font-size: 14px;
  background: var(--bg-raised);
}

th {
  text-align: left;
  padding: 10px 14px;
  background: #f3f0e8;
  color: var(--heading);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.02em;
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}

td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule);
  color: var(--text);
  line-height: 1.5;
  vertical-align: top;
}

tr:last-child td { border-bottom: none; }

td:first-child { font-weight: 600; color: var(--heading); }

/* ---------- Code blocks (always dark — lit window on the page) ---------- */

.code-block {
  position: relative;
  margin: 4px 0 16px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
}

.code-block pre {
  margin: 0;
  padding: 16px 18px;
  overflow-x: auto;
  font-family: "JetBrains Mono", "IBM Plex Mono", monospace;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--code-text);
  white-space: pre-wrap;
  word-break: break-word;
}

.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #2c303a;
  border: 1px solid #3a3f4a;
  color: #b8c4d4;
  font-family: "Inter", sans-serif;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.15s;
}
.copy-btn:hover { background: #3a3f4a; }

/* ---------- Exercise blocks ---------- */

.exercise {
  margin: 18px 0 22px;
  padding: 20px 22px 22px;
  background: var(--exercise-bg);
  border: 1px solid var(--exercise-border);
  border-left-width: 4px;
  border-radius: 8px;
}

.exercise-label {
  font-family: "Inter", sans-serif;
  font-size: 14.5px;
  font-weight: 700;
  color: #8a6315;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.exercise-tag {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--exercise-tag-bg);
  color: #fff;
  padding: 3px 9px;
  border-radius: 20px;
}

.exercise-steps {
  margin: 0 0 14px;
  padding-left: 22px;
}

.exercise-steps li {
  font-size: 15.5px;
  line-height: 1.65;
  color: #4a3c1f;
  margin-bottom: 8px;
}

.exercise-body {
  font-size: 15.5px;
  line-height: 1.7;
  color: #5c4a26;
  margin: 0 0 4px;
}

.followup {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px dashed var(--exercise-border);
}

/* ---------- Callouts ---------- */

.callout {
  display: flex;
  gap: 10px;
  align-items: baseline;
  margin: 4px 0 18px;
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 15px;
  line-height: 1.65;
}

.callout-warning {
  background: var(--warning-bg);
  border-left: 3px solid var(--warning-border);
  color: #7a2a22;
}

.callout-tip {
  background: var(--tip-bg);
  border-left: 3px solid var(--tip-border);
  color: #1a4438;
}

.callout-label {
  font-family: "Inter", sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  flex-shrink: 0;
  opacity: 0.75;
  padding-top: 1px;
}

/* ---------- Downloads ---------- */

.downloads {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 6px 0 18px;
}

.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: "Inter", sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
  padding: 10px 16px;
  border-radius: 7px;
  text-decoration: none;
  transition: background 0.15s, transform 0.1s;
}

.download-btn:hover { background: #175a4b; }
.download-btn:active { transform: scale(0.98); }

.download-icon { font-size: 13px; }

/* ---------- Footer ---------- */

.footer {
  margin-top: 50px;
  padding-top: 28px;
  border-top: 1px solid var(--rule);
  text-align: center;
}

.footer p {
  font-family: "Inter", sans-serif;
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 6px;
}

.footer-sub { font-size: 12px; color: #9a9286; }

/* ---------- Responsive ---------- */

@media (max-width: 900px) {
  .app-shell { flex-direction: column; }
  .siderail {
    position: sticky;
    top: 0;
    width: 100%;
    height: auto;
    max-height: none;
    border-right: none;
    border-bottom: 1px solid var(--rule);
    flex-direction: column;
  }
  .siderail-head { padding: 14px 18px 10px; }
  .jumplinks {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: visible;
    padding: 8px 12px 12px;
    gap: 4px;
  }
  .jumplink-group { display: flex; flex-shrink: 0; }
  .jumplink-group-label { display: none; }
  .jumplink {
    flex-shrink: 0;
    white-space: nowrap;
    padding: 7px 12px;
  }
  .page { padding: 0 24px 80px; max-width: 720px; margin: 0 auto; }
}

@media (max-width: 640px) {
  .hero h1 { font-size: 28px; }
  .module h2 { font-size: 25px; }
  .content-section h3 { font-size: 19px; }
  .brand { font-size: 11.5px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}

/* ============================================================
   V3 ADDITIONS — richer visual character, per-module theming,
   glossary popovers, branding, interactivity
   ============================================================ */

/* ---------- Subtle page texture (signature element, used sparingly) ---------- */

body {
  background-image:
    radial-gradient(circle at 8% 4%, rgba(30, 110, 92, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 95% 18%, rgba(180, 81, 63, 0.04) 0%, transparent 35%);
  background-attachment: fixed;
}

/* ---------- Brand mark + header link ---------- */

.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  text-decoration: none;
  color: var(--heading);
  transition: color 0.15s;
}
.brand:hover { color: var(--accent); }

.brand-mark {
  display: inline-block;
  color: var(--accent);
  font-size: 14px;
  transform: rotate(0deg);
  transition: transform 0.4s ease;
}
.brand:hover .brand-mark { transform: rotate(90deg); }

/* ---------- Hero: richer treatment ---------- */

.hero {
  position: relative;
  padding: 60px 0 44px;
}

.hero::before {
  content: "";
  position: absolute;
  top: -10px;
  left: -40px;
  width: 3px;
  height: 64px;
  background: linear-gradient(180deg, var(--accent), transparent);
  border-radius: 2px;
}

.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero-author-link {
  font-family: "Inter", sans-serif;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s;
}
.hero-author-link:hover { border-bottom-color: var(--accent); }

/* ---------- Module: per-module accent theming ---------- */

.module {
  position: relative;
  padding-left: 22px;
  border-left: 3px solid var(--module-accent, var(--rule));
  border-bottom: none;
  margin-bottom: 8px;
}

.module-header {
  margin-bottom: 28px;
  padding-top: 4px;
}

.module-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.module-day {
  font-family: "Inter", sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--module-accent, var(--accent));
}

.module-done-pill {
  font-family: "Inter", sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: var(--module-accent, var(--accent));
  padding: 2px 9px;
  border-radius: 20px;
}

.module h2::first-letter {
  color: var(--module-accent, var(--accent));
}

.content-section h3 {
  position: relative;
}

.content-section h3::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--module-accent, var(--accent));
  margin-right: 10px;
  vertical-align: middle;
  opacity: 0.7;
}

/* ---------- Progress toggle ---------- */

.progress-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0 48px;
  padding: 9px 16px;
  border: 1.5px solid var(--rule);
  border-radius: 24px;
  background: var(--bg-raised);
  font-family: "Inter", sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.18s;
}

.progress-toggle:hover {
  border-color: var(--module-accent, var(--accent));
  color: var(--module-accent, var(--accent));
}

.progress-toggle.done {
  background: var(--module-accent, var(--accent));
  border-color: var(--module-accent, var(--accent));
  color: #fff;
}

.progress-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  font-size: 10px;
}

.progress-toggle.done .progress-check {
  background: rgba(255, 255, 255, 0.25);
}

/* ---------- Side rail additions ---------- */

.navlink-check {
  display: inline-block;
  margin-right: 2px;
  font-size: 10px;
}

/* ---------- Brand banner (interstitial CTA) ---------- */

.brand-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 8px 0 56px;
  padding: 18px 22px;
  background: linear-gradient(120deg, #1e6e5c, #155248);
  border-radius: 10px;
  text-decoration: none;
  box-shadow: 0 4px 14px rgba(30, 110, 92, 0.18);
  transition: transform 0.15s, box-shadow 0.15s;
}

.brand-banner:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(30, 110, 92, 0.25);
}

.brand-banner-text {
  font-family: "Inter", sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
  color: #eafaf3;
}

.brand-banner-text strong {
  color: #fff;
  font-weight: 700;
}

.brand-banner-arrow {
  font-size: 18px;
  color: #fff;
  flex-shrink: 0;
}

/* ---------- Glossary: clickable terms in code ---------- */

.code-term {
  cursor: pointer;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-decoration-color: #6a93b8;
  text-underline-offset: 3px;
  border-radius: 2px;
  transition: background 0.12s;
}

.code-term:hover {
  background: rgba(106, 147, 184, 0.18);
}

.glossary-popover {
  z-index: 500;
  width: 320px;
  max-width: calc(100vw - 32px);
  background: var(--bg-raised);
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(20, 18, 12, 0.18);
  padding: 16px 18px;
  font-family: "Inter", sans-serif;
  animation: popIn 0.14s ease;
}

@keyframes popIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.glossary-popover-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.glossary-popover-header code {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--heading);
  background: #f3f0e8;
  padding: 2px 7px;
  border-radius: 4px;
}

.glossary-cat {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.glossary-short {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--heading);
  line-height: 1.5;
  margin: 0 0 8px;
}

.glossary-long {
  font-size: 13px;
  line-height: 1.6;
  color: var(--muted);
  margin: 0 0 10px;
}

.glossary-more {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
}
.glossary-more:hover { text-decoration: underline; }

/* ---------- Reference module ---------- */

.ref-list {
  display: grid;
  gap: 4px;
}

.ref-entry {
  padding: 18px 0;
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 110px;
  transition: background 0.6s;
}

.ref-entry:target,
.ref-entry.flash {
  background: var(--accent-soft);
}

.ref-entry-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
}

.ref-entry-head code {
  font-family: "JetBrains Mono", monospace;
  font-size: 16px;
  font-weight: 600;
  color: var(--heading);
}

.ref-cat {
  font-family: "Inter", sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

}, {
  id: "filtering",
  day: "Day 1",
  accent: "#2c6e8f",
  title: "Filtering & Enrichment",
  blurb: "eval, search vs where, fillnull, and turning raw codes into friendly labels with lookups.",
  sections: [{
    heading: "eval — the most versatile command in SPL",
    body: "Creates NEW fields by calculating, transforming, or deriving values from existing ones — arithmetic, string manipulation, conditionals, type conversion, all live here.",

      }, {

    tip: "eval is how raw log noise becomes an analyst-readable severity label. Real SOC dashboards almost never show raw status codes to a triage analyst."

    table: {

      label: "See where search wins, and where where is required",
      code: 'index=tutorial sourcetype=access_combined_wcookie\n| search clientip="10.10.10.0/24"',

      followups: [{

      }]
    },
    tip: "Simple rule: filtering on a raw field, or want wildcards/CIDR → search. Filtering on something eval just calculated, or comparing two fields → where."

    heading: "fillnull — making blank cells look intentional",

    body: "A lookup is a separate reference table (usually a CSV) that maps a raw value to a friendlier one. Three pieces are involved: the lookup table FILE (the CSV), the lookup DEFINITION (tells Splunk the file exists and which column is the key), and the AUTOMATIC LOOKUP (wires the definition to a sourcetype so the new field just appears).",

      code: "index=tutorial sourcetype=access_combined_wcookie\n| lookup http_status_lookup status OUTPUT status_description",

  }]
}, {
  id: "correlation",
  day: "Day 2",
  accent: "#9c3848",
  title: "Correlating Events",
  blurb: "transaction vs stats — the most conceptually subtle decision in SPL, and why a brute-force attack is a sequence, not a single event.",
  sections: [{
    heading: "What a transaction actually is",
    body: "A transaction is a group of conceptually related events treated as one unit — every web request a single visitor made during one browsing session, or every step of a single purchase. transaction marks a series of events as interrelated based on a shared piece of common information.",
    warning: "A brute-force login attempt isn't one event — it's dozens of failed-login events that, taken together, represent one attack. A SOC analyst doesn't care about event #47 in isolation; they care that one IP made 40 failed attempts in 90 seconds, then succeeded."
  }, {
    heading: "Grouping events by field, then by field and time",
    exercise: {
      label: "Build transactions with increasing precision",
      code: "index=tutorial sourcetype=access_combined_wcookie\n| transaction clientip",
      body: "Simplest transaction — one shared field, no time constraint, groups ALL events from that IP across the entire search window.",
      followups: [{
        code: "index=tutorial sourcetype=access_combined_wcookie\n| transaction clientip host",
        body: "Multiple fields — events must share BOTH to be grouped, a tighter result."
      }, {
        code: "index=tutorial sourcetype=access_combined_wcookie\n| transaction clientip maxspan=30s maxpause=5s",
        body: "maxspan limits the TOTAL span (first to last event); maxpause limits the GAP between any two consecutive events."
      }]
    },
    warning: "Events MUST be sorted in descending chronological order (newest first) before maxspan or maxpause are used, or the command silently returns INCORRECT results — not an error, just wrong groupings."
  }, {
    heading: "Defining a transaction by its content, not just time",
    body: "Sometimes a transaction's boundaries are defined by content rather than duration — e.g. a session starts on a login event and ends on a logout event, regardless of how long that takes.",
    exercise: {
      label: "Group by content boundaries",
      code: 'index=tutorial sourcetype=access_combined_wcookie\n| transaction JSESSIONID clientip startswith="view" endswith="purchase"\n| where duration>0',
      body: "Note duration is filtered AFTER transaction, since transaction itself creates that field."
    },
    tip: "Attack chains are usually defined by startswith/endswith logic, not fixed time windows — regardless of whether the chain took 30 seconds or 30 minutes."
  }, {
    heading: "transaction vs stats — the decision that matters most",
    body: "stats calculates statistical values on events grouped by field values, and DISCARDS the original events. transaction also groups events by field values, but does not compute statistics beyond duration — it KEEPS the raw events and their original field values, combined together.",
    table: {
      headers: ["Use transaction when...", "Use stats when..."],
      rows: [["A shared ID alone isn't enough to tell transactions apart", "You have a genuinely unique identifier and just need numbers"], ["A transaction's boundaries are defined by CONTENT, not just an ID", "You don't need to see the original raw events afterward"], ["You need the actual combined raw text of the grouped events", "Performance matters — stats is faster in most cases"]]
    },
    warning: "In cases where either command could solve the problem, stats is usually faster, especially in distributed search environments. Don't reach for transaction by default — reach for it when stats genuinely can't express what you need.",
    tip: "A genuinely cool capability stats cannot match: transaction recognizes transitive relationships — if events A and B share a field, and B and C share a different field, transaction can chain A, B, and C together even though A and C share nothing directly."
  }]

    },

  title: "SOC Capstone — Investigate, Classify, Report",
